<g class="l0"><text x="16" y="54" fill="#7ee787">$</text><text x="32.8" y="54" fill="#f0f6fc" textLength="117.6">cat source.txt</text><rect class="c0" x="32.8" y="40" width="126.0" height="19" fill="#0d1117"/></g>
<text class="l1" x="16" y="73" fill="#c9d1d9" textLength="487.2" xml:space="preserve">Microsoft reported revenue of $56 billion for the quarter.</text>
<text class="l2" x="16" y="92" fill="#c9d1d9" textLength="478.8" xml:space="preserve">Revenue grew 8% year over year, driven by cloud services.</text>
<text class="l3" x="16" y="111" fill="#c9d1d9" textLength="420.0" xml:space="preserve">Azure revenue rose 29%. Operating costs were flat.</text>
<g class="l5"><text x="16" y="149" fill="#7ee787">$</text><text x="32.8" y="149" fill="#f0f6fc" textLength="378.0">cat output.txt   # what the LLM wrote from it</text><rect class="c5" x="32.8" y="135" width="386.4" height="19" fill="#0d1117"/></g>
<text class="l6" x="16" y="168" fill="#c9d1d9" textLength="352.8" xml:space="preserve">Microsoft reported revenue of $56 billion.</text>
<text class="l7" x="16" y="187" fill="#c9d1d9" textLength="285.6" xml:space="preserve">Microsoft grew 40% year over year.</text>
<text class="l8" x="16" y="206" fill="#c9d1d9" textLength="193.2" xml:space="preserve">Azure revenue rose 29%.</text>
<text class="l9" x="16" y="225" fill="#c9d1d9" textLength="252.0" xml:space="preserve">The outlook remains uncertain.</text>
<g class="l11"><text x="16" y="263" fill="#7ee787">$</text><text x="32.8" y="263" fill="#f0f6fc" textLength="294.0">sourced check output.txt source.txt</text><rect class="c11" x="32.8" y="249" width="302.4" height="19" fill="#0d1117"/></g>
<text class="l12" x="16" y="282" fill="#7ee787" textLength="394.8" xml:space="preserve">[OK] Microsoft reported revenue of $56 billion.</text>
<text class="l13" x="16" y="301" fill="#ff7b72" textLength="327.6" xml:space="preserve">[XX] Microsoft grew 40% year over year.</text>
<text class="l14" x="16" y="320" fill="#c9d1d9" textLength="756.0" xml:space="preserve">       claims 40% about Microsoft, but the source&#x27;s passage about them says [&#x27;56 billion&#x27;,</text>
<text class="l15" x="16" y="339" fill="#c9d1d9" textLength="100.8" xml:space="preserve">       &#x27;8%&#x27;]</text>
<text class="l16" x="16" y="358" fill="#7ee787" textLength="235.2" xml:space="preserve">[OK] Azure revenue rose 29%.</text>
<text class="l17" x="16" y="377" fill="#e3b341" textLength="294.0" xml:space="preserve">[??] The outlook remains uncertain.</text>
<text class="l18" x="16" y="396" fill="#c9d1d9" textLength="663.6" xml:space="preserve">       no checkable numbers, quoted text, or capitalized entities in this claim</text>
<text class="l20" x="16" y="434" fill="#7ee787" textLength="336.0" xml:space="preserve">2 grounded, 1 contradicted, 1 unverified</text>
